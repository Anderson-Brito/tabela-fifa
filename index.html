<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tabela FIFA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: placar escuro no topo com seletor de torneio; abas Tabela / Jogos / Mata-mata / Admin numa coluna central */
:root {
  --bg: #eef2ee; --surface: #ffffff; --line: #d5ddd6; --fg: #142019; --muted: #5c6b61;
  --accent: #0f7a3d; --accent-fg: #ffffff; --chalk: #f7faf7; --board: #0d1f15; --board-fg: #e9f5ec;
  --win: #0f7a3d; --draw: #8a6d10; --loss: #b3261e; --lock: #4b5563; --gold: #b8860b; --focus: #1d6fe0;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b130e; --surface: #121d16; --line: #24342a; --fg: #e4ede6; --muted: #92a398;
    --accent: #34b86a; --accent-fg: #06120a; --chalk: #17241b; --board: #050b07; --board-fg: #e9f5ec;
    --win: #45c77a; --draw: #d9b13b; --loss: #f07167; --lock: #9aa4b2; --gold: #f5c542; --focus: #6aa8ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b130e; --surface: #121d16; --line: #24342a; --fg: #e4ede6; --muted: #92a398;
  --accent: #34b86a; --accent-fg: #06120a; --chalk: #17241b; --board: #050b07; --board-fg: #e9f5ec;
  --win: #45c77a; --draw: #d9b13b; --loss: #f07167; --lock: #9aa4b2; --gold: #f5c542; --focus: #6aa8ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }

.top { background: var(--board); color: var(--board-fg); padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 0; }
.top-in { max-width: 1080px; margin: 0 auto; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-width: 0; }
.brand h1 { margin: 0; font: 800 30px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; }
.brand select { background: transparent; color: var(--board-fg); border: 1px solid rgba(233,245,236,.35); border-radius: 6px; padding: 4px 8px; font: 600 15px var(--display); letter-spacing: .04em; max-width: 100%; }
.brand select option { color: #142019; background: #fff; }
.session { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.who { font-weight: 600; }
.chip { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font: 700 12px var(--display); letter-spacing: .08em; text-transform: uppercase; border: 1px solid currentColor; }
.chip.admin { color: #f5c542; } .chip.player { color: #8fe3ad; }
nav.tabs-top { max-width: 1080px; margin: 12px auto 0; display: flex; gap: 2px; overflow-x: auto; }
nav.tabs-top button { background: none; border: 0; color: var(--board-fg); opacity: .65; padding: 10px 14px; border-bottom: 3px solid transparent; cursor: pointer; font: 700 16px var(--display); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
nav.tabs-top button[aria-selected="true"] { opacity: 1; border-bottom-color: var(--accent); }

main { max-width: 1080px; margin: 0 auto; padding: 20px 16px 56px; display: grid; gap: 20px; }
section.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.panel h2 { margin: 0 0 12px; font: 700 20px/1.1 var(--display); letter-spacing: .04em; text-transform: uppercase; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.panel h2 .sub, .sub { font: 500 13px var(--body); letter-spacing: 0; text-transform: none; color: var(--muted); }
h3.group { margin: 18px 0 8px; font: 700 15px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: center; }
h3.group:first-child { margin-top: 0; }

.btn { border: 1px solid var(--line); background: var(--chalk); padding: 7px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.danger { color: var(--loss); }
.btn.armed { background: var(--loss); color: #fff; border-color: var(--loss); }
.btn.small { padding: 4px 9px; font-size: 13px; }
.btn.board { background: transparent; color: var(--board-fg); border-color: rgba(233,245,236,.35); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.champion { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 10px; background: var(--board); color: var(--board-fg); }
.champion .cup { font-size: 34px; line-height: 1; }
.champion b { display: block; font: 800 26px/1.05 var(--display); text-transform: uppercase; letter-spacing: .03em; color: #f5c542; }

.facts { display: flex; flex-wrap: wrap; gap: 6px; }
.fact { font-size: 12.5px; padding: 2px 8px; border-radius: 4px; background: var(--chalk); border: 1px solid var(--line); color: var(--muted); }

/* Classificação */
.table-wrap { overflow-x: auto; margin: 0 -4px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 6px; text-align: center; white-space: nowrap; }
th { font: 700 12px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid var(--line); }
td { border-bottom: 1px solid var(--line); }
td.name, th.name { text-align: left; white-space: normal; min-width: 130px; }
td.pts { font: 800 18px var(--display); }
td.pos { font: 700 16px var(--display); color: var(--muted); width: 34px; border-left: 4px solid transparent; }
tr.q td.pos { border-left-color: var(--accent); color: var(--accent); }
.team { display: block; font-size: 12px; color: var(--muted); }
.form-dots { display: inline-flex; gap: 3px; }
.dot { width: 18px; height: 18px; border-radius: 4px; font: 700 11px/18px var(--display); color: #fff; text-align: center; }
.dot.V { background: var(--win); } .dot.E { background: var(--draw); } .dot.D { background: var(--loss); }
.legend { margin: 10px 0 0; font-size: 13px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.legend label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; color: var(--fg); }
.qmark { display: inline-block; width: 10px; height: 10px; background: var(--accent); border-radius: 2px; }

/* Jogos */
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.pill { border: 1px solid var(--line); background: var(--chalk); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-weight: 600; font-size: 13.5px; }
.pill[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.games { display: grid; gap: 10px; }
.game { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--chalk); border-left: 4px solid var(--line); }
.game.final { border-left-color: var(--lock); }
.game.played { border-left-color: var(--draw); }
.game.mine { box-shadow: inset 0 0 0 1px var(--accent); }
.board { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 10px; align-items: center; }
.board .p { font-weight: 600; min-width: 0; overflow-wrap: anywhere; line-height: 1.2; }
.board .p small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
.board .p.home { text-align: right; }
.sc { display: inline-flex; align-items: center; gap: 6px; font: 800 26px/1 var(--display); background: var(--board); color: var(--board-fg); padding: 4px 10px; border-radius: 6px; font-variant-numeric: tabular-nums; letter-spacing: .04em; white-space: nowrap; }
.sc.empty { opacity: .55; }
.sc input { width: 44px; text-align: center; font: 800 22px var(--display); border: 0; border-radius: 4px; padding: 2px; background: var(--board-fg); color: var(--board); }
.pens { display: flex; justify-content: center; gap: 6px; align-items: center; margin-top: 6px; font-size: 12.5px; color: var(--muted); }
.pens input { width: 40px; text-align: center; border: 1px solid var(--line); border-radius: 4px; padding: 1px; background: var(--surface); }
.meta { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; font-size: 12.5px; color: var(--muted); }
.acts { display: flex; gap: 6px; flex-wrap: wrap; }
.status { font: 700 11px var(--display); letter-spacing: .1em; text-transform: uppercase; padding: 1px 7px; border-radius: 4px; border: 1px solid currentColor; }
.status.final { color: var(--lock); } .status.played { color: var(--draw); } .status.todo { color: var(--muted); }
.empty-box { padding: 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; }

/* Chaveamento */
.bracket { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 1fr); gap: 16px; overflow-x: auto; padding-bottom: 6px; }
.round { display: flex; flex-direction: column; gap: 12px; justify-content: space-around; }
.round h4 { margin: 0; font: 700 14px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.tie { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--chalk); }
.tie .row { display: grid; grid-template-columns: 24px minmax(0,1fr) auto; gap: 6px; padding: 7px 10px; align-items: center; }
.tie .row + .row { border-top: 1px solid var(--line); }
.tie .row.w { font-weight: 700; background: color-mix(in srgb, var(--accent) 12%, transparent); }
.tie .seed { font: 700 12px var(--display); color: var(--muted); }
.tie .agg { font: 800 18px var(--display); font-variant-numeric: tabular-nums; }
.tie .legs { padding: 4px 10px 7px; font-size: 12px; color: var(--muted); border-top: 1px dashed var(--line); }
.tie.tbd .row { color: var(--muted); font-style: italic; }

/* Formulários / Admin */
.field { display: grid; gap: 4px; min-width: 0; }
.field > label, .lbl { font: 700 12px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.field input, .field select, .tinput { padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--chalk); width: 100%; min-width: 0; }
.stack { display: grid; gap: 16px; }
.choice { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.choice label { display: grid; gap: 2px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; background: var(--chalk); }
.choice label:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.choice label:has(input:disabled) { opacity: .45; cursor: not-allowed; }
.choice input { position: absolute; opacity: 0; pointer-events: none; }
.choice b { font: 700 16px var(--display); letter-spacing: .03em; text-transform: uppercase; }
.choice span { font-size: 13px; color: var(--muted); }
.plist { display: grid; gap: 6px; }
.prow { display: grid; grid-template-columns: auto minmax(90px, 140px) minmax(0, 1fr); gap: 10px; align-items: center; }
.prow.two { grid-template-columns: minmax(110px, 160px) minmax(0, 1fr); }
.prow label { display: flex; gap: 8px; align-items: center; font-weight: 600; }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.summary { background: var(--board); color: var(--board-fg); border-radius: 8px; padding: 12px 14px; font-size: 14px; }
.summary b { font: 800 22px var(--display); color: #8fe3ad; }
.msg { font-size: 13px; margin: 0; }
.msg.err { color: var(--loss); } .msg.ok { color: var(--win); }
.hint { font-size: 13px; color: var(--muted); margin: 0; }

dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(400px, calc(100vw - 32px)); background: var(--surface); color: var(--fg); }
dialog::backdrop { background: rgba(5, 12, 8, .6); }
.dlg { padding: 20px; display: grid; gap: 12px; }
.dlg h3 { margin: 0; font: 800 24px var(--display); text-transform: uppercase; letter-spacing: .03em; }
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--board); color: var(--board-fg); padding: 10px 16px; border-radius: 8px; font-weight: 600; max-width: calc(100vw - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.25); z-index: 10; }
@media (max-width: 520px) {
  .prow { grid-template-columns: auto minmax(0, 1fr); }
  .prow .tinput { grid-column: 1 / -1; }
  .sc { font-size: 22px; padding: 4px 8px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>Tabela FIFA</h1>
      <select id="selTorneio" aria-label="Torneio" hidden></select>
    </div>
    <div class="session">
      <span class="who" id="who" hidden></span>
      <span class="chip" id="role" hidden></span>
      <button class="btn board small" id="btnPass" type="button" hidden>Trocar senha</button>
      <button class="btn board small" id="btnLogin" type="button">Entrar</button>
      <button class="btn board small" id="btnLogout" type="button" hidden>Sair</button>
    </div>
  </div>
  <nav class="tabs-top" role="tablist">
    <button role="tab" data-tab="tabela" aria-selected="true" type="button">Tabela</button>
    <button role="tab" data-tab="jogos" aria-selected="false" type="button">Jogos</button>
    <button role="tab" data-tab="mata" aria-selected="false" type="button" id="tabMata">Mata-mata</button>
    <button role="tab" data-tab="admin" aria-selected="false" type="button" id="tabAdmin" hidden>Admin</button>
  </nav>
</header>

<main id="view"></main>

<dialog id="dlgLogin">
  <form class="dlg" id="formLogin">
    <h3>Entrar</h3>
    <div class="field"><label for="lUser">Quem é você?</label><select id="lUser" required></select></div>
    <div class="field"><label for="lPass">Senha</label><input id="lPass" type="password" inputmode="numeric" required autocomplete="current-password"></div>
    <p class="msg err" id="lMsg" hidden></p>
    <div class="row-actions"><button class="btn primary" type="submit" id="lGo">Entrar</button><button class="btn" type="button" data-close>Cancelar</button></div>
    <p class="hint">A senha foi passada pelo Anderson. Esqueceu? Fale com ele.</p>
  </form>
</dialog>

<dialog id="dlgPass">
  <form class="dlg" id="formPass">
    <h3>Trocar senha</h3>
    <div class="field"><label for="pNew">Nova senha</label><input id="pNew" type="password" minlength="6" required autocomplete="new-password"></div>
    <div class="field"><label for="pNew2">Repita a nova senha</label><input id="pNew2" type="password" minlength="6" required autocomplete="new-password"></div>
    <p class="msg" id="pMsg" hidden></p>
    <div class="row-actions"><button class="btn primary" type="submit">Salvar senha</button><button class="btn" type="button" data-close>Cancelar</button></div>
  </form>
</dialog>

<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ===== Supabase (chave pública; a segurança está nas regras do banco) =====
const SUPABASE_URL = "https://tnzxpqbrxycryzsrecjq.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRuenhwcWJyeHljcnl6c3JlY2pxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NzM3MTUsImV4cCI6MjEwNjU0OTcxNX0.BcrGPqb45E3p_ISqICebZiaozbJOEi0S1bDocKbGGus";
const LOGIN_DOMAIN = "fifa.utdlink.com";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const TEAMS = {
  "Top Europa": ["Real Madrid", "Barcelona", "Manchester City", "Liverpool", "Arsenal", "Bayern de Munique", "PSG", "Inter de Milão", "Juventus", "Milan", "Chelsea", "Manchester United", "Atlético de Madrid", "Borussia Dortmund", "Napoli", "Bayer Leverkusen"],
  "Brasileirão": ["Flamengo", "Palmeiras", "Corinthians", "São Paulo", "Santos", "Grêmio", "Internacional", "Atlético-MG", "Cruzeiro", "Botafogo", "Fluminense", "Vasco", "Bahia", "Fortaleza"],
  "Seleções": ["Brasil", "Argentina", "França", "Inglaterra", "Espanha", "Alemanha", "Portugal", "Holanda", "Itália", "Bélgica", "Croácia", "Uruguai"],
};
const FASES = { oitavas: "Oitavas de final", quartas: "Quartas de final", semi: "Semifinal", final: "Final" };
const FASE_POR_N = { 16: "oitavas", 8: "quartas", 4: "semi", 2: "final" };
const PROXIMA = { oitavas: "quartas", quartas: "semi", semi: "final" };
// ordem do chaveamento por semente: 1 e 2 só se encontram na final
const CHAVES = { 2: [[1, 2]], 4: [[1, 4], [2, 3]], 8: [[1, 8], [4, 5], [2, 7], [3, 6]] };

const $ = (id) => document.getElementById(id);
const S = {
  user: null, me: null, perfis: [], jogadores: [], torneios: [],
  tid: null, parts: [], jogos: [], tab: "tabela", filtro: "todos", incOpen: false, editing: null,
};

// ===== utilidades =====
function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, "");
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c);
  return n;
}
function toast(t) { const n = $("toast"); n.textContent = t; n.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (n.hidden = true), 2800); }
function msg(node, text, ok) { node.textContent = text || ""; node.className = "msg " + (ok ? "ok" : "err"); node.hidden = !text; }
function errText(e) {
  const m = (e && (e.message || e.error_description)) || String(e);
  if (/finalizado/i.test(m)) return "Jogo finalizado: só o admin pode alterar.";
  if (/Invalid login/i.test(m)) return "Senha incorreta.";
  if (/row-level security|permission denied/i.test(m)) return "Você não tem permissão para isso.";
  if (/should be different/i.test(m)) return "A nova senha precisa ser diferente da atual.";
  if (/at least/i.test(m)) return "A senha precisa ter pelo menos 6 caracteres.";
  return m;
}
function armed(btn, label, action) {
  btn.addEventListener("click", async () => {
    if (!btn.classList.contains("armed")) {
      const orig = btn.textContent; btn.classList.add("armed"); btn.textContent = label;
      btn._t = setTimeout(() => { btn.classList.remove("armed"); btn.textContent = orig; }, 3500);
      return;
    }
    clearTimeout(btn._t); btn.disabled = true;
    try { await action(); } finally { btn.disabled = false; }
  });
  return btn;
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

const isAdmin = () => !!S.me?.is_admin;
const logged = () => !!S.user;
const T = () => S.torneios.find((t) => t.id === S.tid) || null;
const jog = (id) => S.jogadores.find((j) => j.id === id);
const part = (id) => S.parts.find((p) => p.jogador_id === id);
const nome = (id) => jog(id)?.nome || "—";
const time = (id) => part(id)?.time || "";
const meuJogador = () => S.jogadores.find((j) => j.perfil_id && j.perfil_id === S.user?.id)?.id;
const perfilNome = (uid) => S.perfis.find((p) => p.id === uid)?.nome || "alguém";
const temLiga = (t) => t && t.formato !== "mata";
const temMata = (t) => t && t.formato !== "pontos";
const idaVolta = (t, fase) => (fase === "final" ? t.final_ida_volta : t.mata_ida_volta);

// ===== dados =====
async function loadBase() {
  const [pf, jg, tn] = await Promise.all([
    sb.from("perfis").select("id,nome,usuario,is_admin").order("nome"),
    sb.from("jogadores").select("*").order("nome"),
    sb.from("torneios").select("*").order("criado_em", { ascending: false }),
  ]);
  if (pf.error || jg.error || tn.error) return toast("Não foi possível carregar. Recarregue a página.");
  S.perfis = pf.data; S.jogadores = jg.data; S.torneios = tn.data;
  if (!S.torneios.some((t) => t.id === S.tid)) {
    const salvo = store.get("torneio");
    S.tid = (S.torneios.find((t) => t.id === salvo) || S.torneios.find((t) => t.status === "andamento") || S.torneios[0])?.id || null;
  }
  S.me = S.user ? S.perfis.find((p) => p.id === S.user.id) || null : null;
  await loadTorneio();
}
async function loadTorneio() {
  if (!S.tid) { S.parts = []; S.jogos = []; return render(); }
  const [pt, jg] = await Promise.all([

  if (pt.error || jg.error) return toast("Não foi possível carregar o torneio.");
  S.parts = pt.data; S.jogos = jg.data;

}

// ===== regras do campeonato =====
function standings(includeOpen) {
  const rows = new Map(S.parts.map((p) => [p.jogador_id, { id: p.jogador_id, P: 0, J: 0, V: 0, E: 0, D: 0, GP: 0, GC: 0, last: [] }]));
  const gs = S.jogos.filter((g) => g.fase === "liga" && g.gols_mandante != null && (g.finalizado || includeOpen))
    .sort((a, b) => a.rodada - b.rodada);
  for (const g of gs) {
    const h = rows.get(g.mandante), a = rows.get(g.visitante); if (!h || !a) continue;
    const add = (r, gf, ga) => {
      r.J++; r.GP += gf; r.GC += ga;
      if (gf > ga) { r.V++; r.P += 3; r.last.push("V"); } else if (gf === ga) { r.E++; r.P++; r.last.push("E"); } else { r.D++; r.last.push("D"); }
    };
    add(h, g.gols_mandante, g.gols_visitante); add(a, g.gols_visitante, g.gols_mandante);
  }
  return [...rows.values()].sort((x, y) => y.P - x.P || y.V - x.V || (y.GP - y.GC) - (x.GP - x.GC) || y.GP - x.GP || nome(x.id).localeCompare(nome(y.id), "pt-BR"));
}

// Resultado de um confronto de mata-mata (1 ou 2 jogos)
function confronto(fase, chave) {
  const gs = S.jogos.filter((g) => g.fase === fase && g.chave === chave).sort((a, b) => a.perna - b.perna);
  if (!gs.length) return null;
  const last = gs[gs.length - 1];
  const a = last.mandante, b = last.visitante; // "a" manda o jogo decisivo (melhor semente)
  let ga = 0, gb = 0;
  for (const g of gs) {
    if (g.gols_mandante == null) continue;
    if (g.mandante === a) { ga += g.gols_mandante; gb += g.gols_visitante; } else { ga += g.gols_visitante; gb += g.gols_mandante; }
  }
  const pa = last.penaltis_mandante, pb = last.penaltis_visitante;
  const done = gs.every((g) => g.finalizado);
  let winner = null;
  if (done) winner = ga > gb ? a : gb > ga ? b : pa != null && pa !== pb ? (pa > pb ? a : b) : null;
  return { a, b, ga, gb, pa, pb, done, winner, games: gs };
}
function isDecisivo(g) { return g.fase !== "liga" && g.perna === S.jogos.filter((x) => x.fase === g.fase && x.chave === g.chave).reduce((m, x) => Math.max(m, x.perna), 1); }
// Placar agregado do confronto se este jogo tiver o placar informado
function agregadoCom(g, gm, gv) {
  const gs = S.jogos.filter((x) => x.fase === g.fase && x.chave === g.chave);
  let a = 0, b = 0; // a = mandante deste jogo
  for (const x of gs) {
    const hm = x.id === g.id ? gm : x.gols_mandante, hv = x.id === g.id ? gv : x.gols_visitante;
    if (hm == null) continue;
    if (x.mandante === g.mandante) { a += hm; b += hv; } else { a += hv; b += hm; }
  }
  return [a, b];
}
function faseAtualMata() {
  const fases = ["oitavas", "quartas", "semi", "final"].filter((f) => S.jogos.some((g) => g.fase === f));
  return fases[fases.length - 1] || null;
}
function campeao() {
  const t = T(); if (!t) return null;
  if (t.campeao) return t.campeao;
  if (t.formato === "pontos") {
    const liga = S.jogos.filter((g) => g.fase === "liga");
    if (liga.length && liga.every((g) => g.finalizado)) return standings(false)[0]?.id || null;
    return null;
  }
  const c = confronto("final", 1);
  return c?.winner || null;
}

// Tabela de rodadas (método do círculo): todos contra todos
function roundRobin(ids, turnos) {
  const a = shuffle(ids); if (a.length % 2) a.push(null);
  const n = a.length, rodadas = [];
  for (let r = 0; r < n - 1; r++) {
    const pares = [];
    for (let i = 0; i < n / 2; i++) {
      const h = a[i], v = a[n - 1 - i];
      if (h && v) pares.push(r % 2 && i === 0 ? [v, h] : [h, v]);
    }
    rodadas.push(pares);
    a.splice(1, 0, a.pop());
  }
  const out = rodadas.map((p, i) => ({ rodada: i + 1, pares: p }));
  if (turnos === 2) rodadas.forEach((p, i) => out.push({ rodada: n + i, pares: p.map(([h, v]) => [v, h]) }));
  return out;
}
// Jogos de uma fase do mata-mata a partir de pares [melhor, pior]
function jogosDaFase(t, fase, pares) {
  const rows = [];
  pares.forEach(([melhor, pior], i) => {
    const chave = i + 1;
    if (idaVolta(t, fase)) {
      rows.push({ torneio_id: t.id, fase, chave, perna: 1, rodada: 1, mandante: pior, visitante: melhor });
      rows.push({ torneio_id: t.id, fase, chave, perna: 2, rodada: 2, mandante: melhor, visitante: pior });
    } else rows.push({ torneio_id: t.id, fase, chave, perna: 1, rodada: 1, mandante: melhor, visitante: pior });
  });
  return rows;
}

        } }, "Salvar times")))));
}

function datalistTimes() { return el("datalist", { id: "dlTimes" }, Object.values(TEAMS).flat().map((x) => el("option", { value: x }))); }

function novoTorneio() {
  const f = { formato: "pontos_mata", turnos: "1", classificados: "4", mata: "0", final: "0" };
  const radio = (name, value, titulo, desc, checked) => el("label", {}, el("input", { type: "radio", name, value, checked }), el("b", {}, titulo), el("span", {}, desc));
  const jogadores = S.jogadores.slice().sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
  const lista = el("div", { class: "plist" }, jogadores.map((j) => el("div", { class: "prow two" },
    el("label", {}, el("input", { type: "checkbox", class: "pchk", value: j.id, checked: true }), j.nome),
    el("input", { class: "tinput ptime", list: "dlTimes", maxlength: "40", "data-id": j.id, placeholder: "Time (opcional)" }))));

  const pool = el("select", { class: "tinput", style: "width:auto" }, Object.keys(TEAMS).map((k) => el("option", { value: k }, k)));
  const sortear = el("button", { class: "btn", type: "button", onclick: () => {
    const sel = [...lista.querySelectorAll(".pchk:checked")].map((c) => c.value);
    const times = shuffle(TEAMS[pool.value]);
    if (times.length < sel.length) return toast("Essa lista não tem times suficientes.");
    sel.forEach((id, i) => { lista.querySelector(`.ptime[data-id="${id}"]`).value = times[i]; });
  } }, "Sortear times");

  const form = el("form", { class: "stack", id: "formNovo" },
    el("div", { class: "field" }, el("label", { for: "tNome" }, "Nome do torneio"), el("input", { id: "tNome", maxlength: "60", required: true, value: "Copa FIFA " + new Date().getFullYear() })),
    el("div", { class: "stack", style: "gap:8px" }, el("span", { class: "lbl" }, "Jogadores e times"), lista,
      el("div", { class: "row-actions" }, pool, sortear, el("span", { class: "hint" }, "ou digite o time de cada um"))),
    el("div", { class: "stack", style: "gap:8px" }, el("span", { class: "lbl" }, "Formato"),
      el("div", { class: "choice" },
        radio("formato", "pontos", "Pontos corridos", "Todos contra todos. Campeão é quem somar mais pontos."),
        radio("formato", "pontos_mata", "Pontos + mata-mata", "Todos contra todos e os melhores vão para o mata-mata.", true),
        radio("formato", "mata", "Só mata-mata", "Chaveamento sorteado direto. Precisa de 2, 4 ou 8 jogadores."))),
    el("div", { class: "stack", style: "gap:8px", id: "bLiga" }, el("span", { class: "lbl" }, "Fase de pontos"),
      el("div", { class: "choice" },
        radio("turnos", "1", "Turno único", "Cada dupla joga 1 vez.", true),
        radio("turnos", "2", "Ida e volta", "Cada dupla joga 2 vezes, uma em cada mando."))),
    el("div", { class: "stack", style: "gap:8px", id: "bClass" }, el("span", { class: "lbl" }, "Quantos vão para o mata-mata"),
      el("div", { class: "choice" },
        radio("classificados", "2", "Final direta", "Os 2 primeiros decidem o título."),
        radio("classificados", "4", "Semifinal", "Os 4 primeiros: 1º×4º e 2º×3º.", true),
        radio("classificados", "8", "Quartas de final", "Os 8 primeiros: 1º×8º, 2º×7º…"))),
    el("div", { class: "stack", style: "gap:8px", id: "bMata" }, el("span", { class: "lbl" }, "Jogos do mata-mata"),
      el("div", { class: "choice" },
        radio("mata", "0", "Jogo único", "Empatou, pênaltis. Melhor campanha tem o mando.", true),
        radio("mata", "1", "Ida e volta", "Vale o agregado. Melhor campanha decide em casa.")),
      el("div", { class: "choice" },
        radio("final", "0", "Final em jogo único", "Um jogo só decide o título.", true),
        radio("final", "1", "Final ida e volta", "Dois jogos, vale o agregado."))),
    el("div", { class: "summary", id: "tResumo" }),
    el("p", { class: "msg", id: "tMsg", hidden: true }),
    el("div", { class: "row-actions" }, el("button", { class: "btn primary", type: "submit", id: "tCriar" }, "Criar torneio e gerar jogos")));

  const val = (name) => form.querySelector(`input[name="${name}"]:checked`)?.value;
  function atualizar() {
    const n = form.querySelectorAll(".pchk:checked").length;
    const fmt = val("formato");
    form.querySelector("#bLiga").hidden = fmt === "mata";
    form.querySelector("#bClass").hidden = fmt !== "pontos_mata";
    form.querySelector("#bMata").hidden = fmt === "pontos";
    form.querySelectorAll('input[name="classificados"]').forEach((r) => { r.disabled = +r.value > n; if (r.disabled && r.checked) { const ok = [...form.querySelectorAll('input[name="classificados"]')].filter((x) => +x.value <= n).pop(); if (ok) ok.checked = true; } });
    const turnos = +val("turnos"), mv = val("mata") === "1", fv = val("final") === "1";
    let ligaJogos = 0, mataJogos = 0, linhas = [], erro = "";
    if (n < 2) erro = "Escolha pelo menos 2 jogadores.";
    if (fmt !== "mata") {
      ligaJogos = (n * (n - 1) / 2) * turnos;
      const rods = (n % 2 ? n : n - 1) * turnos;
      linhas.push(`Fase de pontos: ${ligaJogos} jogos em ${rods} rodadas` + (n % 2 ? " (1 folga por rodada)" : ""));
    }
    if (fmt !== "pontos") {
      const k = fmt === "mata" ? n : +val("classificados");
      if (fmt === "mata" && ![2, 4, 8].includes(n)) erro = `Só mata-mata precisa de 2, 4 ou 8 jogadores (marcados: ${n}).`;
      else {
        let q = k / 2, fase = FASE_POR_N[k];
        while (fase) { mataJogos += q * ((fase === "final" ? fv : mv) ? 2 : 1); fase = PROXIMA[fase]; q /= 2; }
        linhas.push(`Mata-mata: começa na ${FASES[FASE_POR_N[k]].toLowerCase()}, ${mataJogos} jogos no máximo`);
      }
    }
    const resumo = form.querySelector("#tResumo"); resumo.replaceChildren();
    if (erro) resumo.append(el("span", {}, erro));
    else resumo.append(el("b", {}, String(ligaJogos + mataJogos)), " jogos no total · " + n + " jogadores", el("br"), linhas.join(" · "));
    form.querySelector("#tCriar").disabled = !!erro;
  }
  form.addEventListener("change", atualizar);
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const m = form.querySelector("#tMsg");
    const ids = [...form.querySelectorAll(".pchk:checked")].map((c) => c.value);
    const fmt = val("formato");
    const novo = {
      nome: form.querySelector("#tNome").value.trim(), formato: fmt,
      turnos: fmt === "mata" ? 1 : +val("turnos"),
      classificados: fmt === "pontos_mata" ? +val("classificados") : fmt === "mata" ? ids.length : null,
      mata_ida_volta: fmt !== "pontos" && val("mata") === "1",
      final_ida_volta: fmt !== "pontos" && val("final") === "1",
    };
    const btn = form.querySelector("#tCriar"); btn.disabled = true;
    try {
      const { data: t, error } = await sb.from("torneios").insert(novo).select().single();
      if (error) throw error;
      const sementes = shuffle(ids);
      const parts = ids.map((id) => ({ torneio_id: t.id, jogador_id: id, time: form.querySelector(`.ptime[data-id="${id}"]`).value.trim() || null, semente: fmt === "mata" ? sementes.indexOf(id) + 1 : null }));
      const r1 = await sb.from("participantes").insert(parts); if (r1.error) throw r1.error;
      let jogos = [];
      if (fmt !== "mata") for (const r of roundRobin(ids, novo.turnos)) for (const [h, v] of r.pares) jogos.push({ torneio_id: t.id, fase: "liga", rodada: r.rodada, mandante: h, visitante: v });
      else {
        const porSemente = (s) => sementes[s - 1];
        jogos = jogosDaFase(t, FASE_POR_N[ids.length], CHAVES[ids.length].map(([a, b]) => [porSemente(a), porSemente(b)]));
      }
      const r2 = await sb.from("jogos").insert(jogos); if (r2.error) throw r2.error;
      S.tid = t.id; store.set("torneio", t.id);
      toast("Torneio criado com " + jogos.length + " jogos");
      S.tab = fmt === "mata" ? "mata" : "jogos";
      await loadBase();
    } catch (err) { msg(m, errText(err)); btn.disabled = false; }
  });
  queueMicrotask(atualizar);
  return el("section", { class: "panel" }, el("h2", {}, "Novo torneio", el("span", { class: "sub" }, "Os jogos são gerados automaticamente")), form);
}

async function gerarMataDaLiga(t, m) {
  const top = standings(false).slice(0, t.classificados).map((r) => r.id);
  for (let i = 0; i < top.length; i++) {
    const { error } = await sb.from("participantes").update({ semente: i + 1 }).eq("torneio_id", t.id).eq("jogador_id", top[i]);
    if (error) return msg(m, errText(error));
  }
  const fase = FASE_POR_N[t.classificados];
  const jogos = jogosDaFase(t, fase, CHAVES[t.classificados].map(([a, b]) => [top[a - 1], top[b - 1]]));
  const { error } = await sb.from("jogos").insert(jogos);
  if (error) return msg(m, errText(error));
  toast(FASES[fase] + " gerada"); S.tab = "mata"; await loadTorneio();
}
async function gerarProxima(t, fase, m) {
  const n = S.jogos.filter((g) => g.fase === fase).reduce((s, g) => Math.max(s, g.chave), 0);
  const vencedores = Array.from({ length: n }, (_, i) => confronto(fase, i + 1).winner);
  const sem = (id) => part(id)?.semente ?? 99;
  const pares = [];
  for (let i = 0; i < vencedores.length; i += 2) {
    const [x, y] = [vencedores[i], vencedores[i + 1]];
    pares.push(sem(x) <= sem(y) ? [x, y] : [y, x]);
  }
  const prox = PROXIMA[fase];
  const { error } = await sb.from("jogos").insert(jogosDaFase(t, prox, pares));
  if (error) return msg(m, errText(error));
  toast(FASES[prox] + " gerada"); S.tab = "mata"; await loadTorneio();
}

// ===== ações de placar =====
function lerNum(id) { const v = $(id)?.value.trim(); if (v === "" || v == null) return null; const n = Number(v); return Number.isInteger(n) && n >= 0 && n <= 99 ? n : NaN; }
async function salvarPlacar(g, finalizar) {
  const gm = lerNum("gh-" + g.id), gv = lerNum("gv-" + g.id);
  if ([gm, gv].some((x) => Number.isNaN(x))) return toast("Placar inválido (use 0 a 99).");
  if ((gm == null) !== (gv == null)) return toast("Preencha os gols dos dois lados.");
  if (finalizar && gm == null) return toast("Preencha o placar antes de finalizar.");
  const upd = { gols_mandante: gm, gols_visitante: gv };
  if (isDecisivo(g)) {
    let pm = lerNum("ph-" + g.id), pv = lerNum("pv-" + g.id);
    if ([pm, pv].some((x) => Number.isNaN(x))) return toast("Pênaltis inválidos.");
    const [a, b] = gm == null ? [0, 1] : agregadoCom(g, gm, gv);
    if (a !== b) { pm = null; pv = null; }
    else if (finalizar && (pm == null || pv == null || pm === pv)) return toast("Empate no " + (idaVolta(T(), g.fase) ? "agregado" : "jogo") + ": informe o vencedor nos pênaltis.");
    if ((pm == null) !== (pv == null)) return toast("Preencha os pênaltis dos dois lados.");
    upd.penaltis_mandante = pm; upd.penaltis_visitante = pv;
  }
  if (finalizar) upd.finalizado = true;
  const { data, error } = await sb.from("jogos").update(upd).eq("id", g.id).select();
  if (error) return toast(errText(error));
  if (!data?.length) { await loadTorneio(); return toast("Jogo finalizado: só o admin pode alterar."); }
  S.editing = null; toast(finalizar ? "Jogo finalizado" : "Placar salvo"); await loadTorneio();
}
async function reabrir(g) {
  const { data, error } = await sb.from("jogos").update({ finalizado: false }).eq("id", g.id).select();
  if (error || !data?.length) return toast(error ? errText(error) : "Sem permissão.");
  toast("Jogo reaberto"); await loadTorneio();
}

// ===== login =====
function abrirLogin() {
  const sel = $("lUser");
  sel.replaceChildren(el("option", { value: "" }, "Escolha seu nome…"), ...S.perfis.filter((p) => p.usuario).map((p) => el("option", { value: p.usuario }, p.nome)));
  const last = store.get("usuario"); if (last) sel.value = last;
  $("lPass").value = ""; msg($("lMsg"), ""); $("dlgLogin").showModal();
  (sel.value ? $("lPass") : sel).focus();
}
$("formLogin").addEventListener("submit", async (e) => {
  e.preventDefault();
  const u = $("lUser").value; if (!u) return msg($("lMsg"), "Escolha seu nome.");
  $("lGo").disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: `${u}@${LOGIN_DOMAIN}`, password: $("lPass").value });
  $("lGo").disabled = false;
  if (error) return msg($("lMsg"), errText(error));
  store.set("usuario", u); $("dlgLogin").close(); toast("Bem-vindo!");
});
$("formPass").addEventListener("submit", async (e) => {
  e.preventDefault();
  const a = $("pNew").value, b = $("pNew2").value;
  if (a !== b) return msg($("pMsg"), "As senhas não são iguais.");
  const { error } = await sb.auth.updateUser({ password: a });
  if (error) return msg($("pMsg"), errText(error));
  $("dlgPass").close(); toast("Senha alterada");
});
document.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", () => b.closest("dialog").close()));
$("btnLogin").addEventListener("click", abrirLogin);
$("btnPass").addEventListener("click", () => { $("pNew").value = $("pNew2").value = ""; msg($("pMsg"), ""); $("dlgPass").showModal(); });
$("btnLogout").addEventListener("click", async () => { await sb.auth.signOut(); toast("Você saiu"); });
$("selTorneio").addEventListener("change", (e) => { S.tid = e.target.value; store.set("torneio", S.tid); S.editing = null; loadTorneio(); });
document.querySelectorAll("nav.tabs-top button").forEach((b) => b.addEventListener("click", () => go(b.dataset.tab)));

sb.auth.onAuthStateChange((_ev, session) => {
  S.user = session?.user || null;
  setTimeout(() => { S.me = S.user ? S.perfis.find((p) => p.id === S.user.id) || null : null; render(); }, 0);
});

// ===== tempo real =====
let rt;
// não recarrega no meio de uma digitação nem com o formulário do Admin aberto
const ocupado = () => S.editing || S.tab === "admin" || (document.activeElement?.matches?.("#view input, #view select") ?? false);
const recarregar = () => { clearTimeout(rt); rt = setTimeout(() => (ocupado() ? recarregar() : loadBase()), 800); };
sb.channel("fifa")
  .on("postgres_changes", { event: "*", schema: "public", table: "jogos" }, recarregar)
  .on("postgres_changes", { event: "*", schema: "public", table: "torneios" }, recarregar)
  .on("postgres_changes", { event: "*", schema: "public", table: "participantes" }, recarregar)
  .subscribe();

document.body.append(datalistTimes());
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  S.user = session?.user || null;
  await loadBase();
})();
</script>
